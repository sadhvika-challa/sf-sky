name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm exec -- tsc -b

      - name: Test
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Verify iOS shell
        run: npm run ios:verify

      - name: Verify generated native state is committed
        run: git diff --exit-code

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify production PWA
        run: npm run test:pwa:artifact
