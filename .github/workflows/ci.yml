name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm exec -- tsc -b

      - name: Test
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Verify iOS shell
        run: npm run ios:verify

      - name: Verify App Store release structure
        run: npm run ios:release:verify

      - name: Verify generated native state is committed
        run: git diff --exit-code

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Verify deterministic browser journeys
        run: npm run test:e2e

      - name: Verify production PWA
        run: npm run test:pwa:artifact

  ios-native-archive:
    name: Archive native iOS shell
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      IOS_BUILD_NUMBER: "1"
      IOS_MARKETING_VERSION: "1.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify required Xcode toolchain
        run: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')"
          IOS_SDK_MAJOR="$(xcodebuild -showsdks | sed -nE 's/.*-sdk iphoneos([0-9]+).*/\1/p' | sort -nr | head -1)"
          test "${XCODE_MAJOR}" -ge 26
          test "${IOS_SDK_MAJOR}" -ge 26

      - name: Install dependencies
        run: npm ci

      - name: Generate native web bundle
        run: npm run native:sync

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Archive Release shell for a generic iOS device without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Soleil.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/SoleilArchive.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Verify unsigned iOS archive contents
        run: |
          npm run ios:archive:verify -- \
            --archive "$RUNNER_TEMP/Soleil.xcarchive" \
            --bundle-id com.sadhvika.soleil \
            --marketing-version "$IOS_MARKETING_VERSION" \
            --build-number "$IOS_BUILD_NUMBER" \
            --device-families 1,2 \
            --report "$RUNNER_TEMP/ios-archive-verification.json"

      - name: Verify generated native state is committed
        run: git diff --exit-code

      - name: Package unsigned archive
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Soleil.xcarchive" "$RUNNER_TEMP/Soleil.xcarchive.zip"

      - name: Upload archive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-archive-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ios-archive-verification.json
            ${{ runner.temp }}/Soleil.xcarchive.zip
            ${{ runner.temp }}/SoleilArchive.xcresult
          if-no-files-found: warn
          retention-days: 7
